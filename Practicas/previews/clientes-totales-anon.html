<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1729" />
  <title>Ranking anonimizado de clientes</title>
  <style>
    :root { color-scheme: dark; background: #0e1729; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: clamp(16px, 4vw, 52px); background: #0e1729; }
    img { display: block; width: min(100%, 1256px); height: auto; box-shadow: 0 18px 42px rgba(2, 8, 23, .25); }
  </style>
</head>
<body>
  <img src="clientes-totales-anon.svg" width="1256" height="776" alt="Ranking anonimizado de tres clientes por total acumulado" />
</body>
</html>
